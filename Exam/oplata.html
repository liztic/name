<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата та Доставка | GreenAgro</title>
    <style>
        /* Базові стилі сайту (Твій оригінальний CSS) */
        html {
            scroll-behavior: smooth;
        }
        html, body {
            width: 750px;
            height: 100%;
            margin: 0;
            margin-left: 125px;
            background: #f4f6f8; /* Світлий приємний фон для форми */
            font-size: 16px;
            font-family: 'Inter', 'Roboto', sans-serif;
        }
        .container {
            padding: 20px;
            margin: 0 auto;
            position: relative;
            text-align: center;
        }
        h2 {
            color: #222831;
            margin-bottom: 10px;
        }

        /* --- НОВИЙ СТИЛЬ: ВІЗУАЛЬНА БАНКІВСЬКА КАРТКА --- */
        .visual-card {
            width: 360px;
            height: 210px;
            background: rgba(173, 162, 253); /* Фірмовий зелений градієнт GreenAgro */
            margin: 20px auto;
            border-radius: 15px;
            padding: 20px;
            box-sizing: border-box;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 10px 25px rgba(17, 153, 142, 0.4);
            position: relative;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .card-chip {
            width: 45px;
            height: 35px;
            background: linear-gradient(135px, #fbc2eb, #a6c1ee);
            border-radius: 5px;
            margin-bottom: 25px;
        }
        .card-number-display {
            font-size: 22px;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-align: center;
        }
        .card-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
        }
        .card-label {
            font-size: 9px;
            display: block;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 3px;
            font-family: Arial, sans-serif;
        }
        .card-holder-display, .card-expiry-display {
            font-size: 14px;
            text-transform: uppercase;
        }

        /* --- СТИЛЬ ФОРМИ ВВЕДЕННЯ --- */
        .payment-card {
            max-width: 400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e1e4e8;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #4CAF50;
            outline: none;
        }
        .form-row {
            display: flex;
            justify-content: space-between;
        }
        .form-row .form-group {
            width: 48%;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: #45a049;
        }
        .submit-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Оформлення замовлення</h2>
    
    <!-- Інтерактивний пластик картки -->
    <div class="visual-card">
        <div class="card-chip"></div>
        <div class="card-number-display" id="card-num-preview">•••• •••• •••• ••••</div>
        <div class="card-flex">
            <div class="card-holder-block">
                <span class="card-label">ВЛАСНИК КАРТКИ</span>
                <div class="card-holder-display" id="card-holder-preview">YOUR NAME</div>
            </div>
            <div class="card-expiry-block">
                <span class="card-label">ТЕРМІН ДІЇ</span>
                <div class="card-expiry-display" id="card-expiry-preview">MM/YY</div>
            </div>
        </div>
    </div>

    <!-- Безпечна форма для введення -->
    <form id="payment-form" class="payment-card">
        <div class="form-group">
            <label for="card-number">Номер картки:</label>
            <input type="text" id="card-number" maxlength="19" placeholder="0000 0000 0000 0000" required autocomplete="off">
        </div>

        <div class="form-group">
            <label for="card-name">Ім'я та Прізвище власника (латиницею):</label>
            <input type="text" id="card-name" placeholder="IVAN IVANOV" required autocomplete="off">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="card-expiry">Термін дії:</label>
                <input type="text" id="card-expiry" maxlength="5" placeholder="MM/YY" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="card-cvv">CVV / CVC2:</label>
                <input type="password" id="card-cvv" maxlength="3" placeholder="000" required autocomplete="off">
            </div>
        </div>

        <button type="submit" class="submit-btn">Підтвердити та оплатити замовлення</button>
    </form>
</div>

<!-- Оновлений JavaScript: автоматичні маски, копіювання даних на картку та перенаправлення -->
<script>
    const inputNum = document.getElementById('card-number');
    const inputName = document.getElementById('card-name');
    const inputExpiry = document.getElementById('card-expiry');

    const previewNum = document.getElementById('card-num-preview');
    const previewName = document.getElementById('card-holder-preview');
    const previewExpiry = document.getElementById('card-expiry-preview');

    // 1. Форматування номера картки (пробіли через кожні 4 цифри)
    inputNum.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
        let formatted = value.match(/.{1,4}/g);
        
        if (formatted) {
            e.target.value = formatted.join(' ');
            previewNum.innerText = formatted.join(' ');
        } else {
            e.target.value = '';
            previewNum.innerText = '•••• •••• •••• ••••';
        }
    });

    // 2. Введення імені (тільки англійські літери + автоматичний CapsLock)
    inputName.addEventListener('input', (e) => {
        let value = e.target.value.toUpperCase();
        value = value.replace(/[^A-Z\s]/g, '');
        e.target.value = value;
        previewName.innerText = value || 'YOUR NAME';
    });

    // 3. Маска терміну дії (автоматичний слеш після місяця)
    inputExpiry.addEventListener('input', (e) => {
        let value = e.target.value.replace(/[^0-9]/g, '');
        if (value.length > 2) {
            value = value.substring(0, 2) + '/' + value.substring(2, 4);
        }
        e.target.value = value;
        previewExpiry.innerText = value || 'MM/YY';
    });

    // 4. Поведінка при натисканні кнопки оплати
    document.getElementById('payment-form').addEventListener('submit', (e) => {
        e.preventDefault(); // Зупиняємо стандартне перезавантаження
        alert('Дякуємо! Ваше замовлення успішно оплачене.');
        window.location.href = 'index.html'; // Автоматично повертає на головну сторінку вашого сайту
    });
</script>

</body>
</html>
