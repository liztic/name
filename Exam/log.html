<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>fngfngx</title>
	<link rel="stylesheet" type="text/css" href="log.css">
</head>
<body>

<div class="form-box">
    <div class="toggle-buttons">
      <button id="tab-login" class="active" onclick="switchTab('login')">Login</button>
      <button id="tab-register" onclick="switchTab('register')">Register</button>
    </div>

    <form id="authForm" action="#" method="post">
      <div class="container">
        <!-- Меняющийся заголовок -->
        <h2 id="form-title">Login</h2>
        
        <p>
          <label for="first_name">First name (Логін)</label>
          <input type="text" id="first_name" name="first_name" required>
        </p>
        
        <!-- Дополнительные поля, которые будут скрываться во входе -->
        <div id="extra-fields" style="display: none;">
          <p>
            <label for="second_name">Second name</label>
            <input type="text" id="second_name" name="second_name">
          </p>
          
          <p>
            <label for="ph_number">Phone number</label>
            <input type="tel" id="ph_number" name="ph_number" placeholder="050-111-22-33">
          </p>
          
          <p class="s">
            <label><input type="radio" name="s" value="male"> Male</label>
            <label><input type="radio" name="s" value="female"> Female</label>
          </p>
          
          <p>
            <label for="news">
              <input type="checkbox" id="news" name="news"> I want to receive news
            </label>
          </p>
        </div>

        <p>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </p>
        
        <!-- Системные уведомления -->
        <div id="errorMessage" class="error-message" style="display: none;"></div>
        <div id="successMessage" class="success-message" style="display: none;"></div>

        <p class="submit">
          <!-- Текст на кнопке тоже будет меняться -->
          <input type="submit" id="submit-btn" value="Submit">
        </p>
      </div>
    </form>
  </div>

  <script src="script.js"></script>











</body>
</html>
