<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товар закінчився</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #202124;
            color: #e8eaed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .error-container {
            text-align: left;
            max-width: 600px;
            padding: 20px;
        }

        .error-icon {
            margin-bottom: 24px;
        }

        .error-icon svg {
            fill: #9aa0a6;
        }

        .error-title {
            font-size: 20px;
            font-weight: 400;
            line-height: 1.4;
            margin-bottom: 16px;
            color: #f1f3f4;
        }

        .error-message {
            font-size: 14px;
            line-height: 1.5;
            color: #9aa0a6;
            margin-bottom: 24px;
        }

        .error-code {
            font-size: 12px;
            font-family: monospace;
            color: #80868b;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <!-- Іконка сумного файлу/коробки -->
        <div class="error-icon">
            <svg width="48" height="48" viewBox="0 0 24 24">
                <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
            </svg>
        </div>

        <!-- Головний текст -->
        <h1 class="error-title">Вибачте, в нас уже не залишилося цього товару</h1>
        
        <!-- Додатковий текст -->
        <p class="error-message">Можливо, його розкупили, зняли з продажу або посилання застаріло.</p>
        
        <!-- Код помилки -->
        <div class="error-code">ERR_OUT_OF_STOCK</div>
    </div>

</body>
</html>
